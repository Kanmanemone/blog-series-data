name: 티스토리 시리즈 목차 동기화 (수동 실행)

on:
  # 예약 실행은 tistory-series-sync.yml로 분리되어 있다(동작은 동일, 트리거만 다름).
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 동기화 스크립트 실행
        run: node scripts/sync-tistory-series/index.js

      - name: 변경 사항 커밋 및 push
        run: |
          # 변경 사항이 없으면(User Story 1 시나리오 2) 아무 것도 하지 않고 종료한다.
          if [ -z "$(git status --porcelain)" ]; then
            echo "변경 사항 없음 - 커밋을 건너뜁니다."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- '*_series.json' .github/sync-state.json
          if [ -f .github/series-assignments.json ]; then
            git add .github/series-assignments.json
          fi

          # 002-post-drift-detection: 스크립트가 이번 실행에서 실제로 생성·갱신·
          # 삭제한 내역을 커밋 메시지 본문에 담는다(FR-012, SC-007). 요약 파일이
          # 없으면(드리프트 반영 없이 001의 신규 게시글 처리만 있었던 실행) 제목
          # 줄만 사용한다 — 커밋 메시지가 매번 똑같은 고정 문구로 남지 않는다.
          # 요약 파일이 있으면(items 1건당 1줄, renderCommitSummary) 줄 수를 세어
          # 제목 줄에 총 건수를 덧붙이고, 본문은 그 줄들(각 줄 "- " 불릿)을 그대로 쓴다.
          if [ -f .sync-commit-summary.txt ]; then
            change_count=$(wc -l < .sync-commit-summary.txt)
            git commit -m "chore: 티스토리 시리즈 목차 동기화 (총 ${change_count}건)" -m "$(cat .sync-commit-summary.txt)"
            rm -f .sync-commit-summary.txt
          else
            git commit -m "chore: 티스토리 시리즈 목차 동기화"
          fi

          # 병합 검토 없이 기본 브랜치로 즉시 push한다(spec.md Clarifications Session 2026-07-22).
          # 다른 실행과 겹쳐 push가 거부되면 자동 재시도 없이 이 스텝을 실패로 종료한다 —
          # 다음 예약 실행이나 관리자의 수동 재실행으로 자연히 복구된다(Edge Cases 참고).
          if ! git push; then
            echo "push 실패 - 다른 실행과 겹쳤을 수 있습니다. 재시도하지 않고 실패로 종료합니다." >&2
            exit 1
          fi
