name: 게시글 시리즈 목차 동기화 (수동 실행)

on:
  # 예약 실행은 tistory-series-sync.yml로 분리되어 있다(동작은 동일, 트리거만 다름).
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 동기화 스크립트 실행
        run: node scripts/sync-tistory-series/index.js

      - name: 변경 사항 커밋 및 push
        run: |
          # 변경 사항이 없으면(User Story 1 시나리오 2) 아무 것도 하지 않고 종료한다.
          if [ -z "$(git status --porcelain)" ]; then
            echo "변경 사항 없음 - 커밋을 건너뜁니다."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- '*_series.json' .github/sync-state.json
          if [ -f .github/series-assignments.json ]; then
            git add .github/series-assignments.json
          fi

          # 003-post-sync-commit-categories: 스크립트가 이번 실행에서 집계한 8개
          # 카테고리(게시글: 새 글/정보 갱신/삭제, 시리즈: 생성/항목 추가/항목 제거/
          # 제목 갱신/삭제)를 커밋 메시지 본문에 담는다. 요약 파일의 첫 줄이 총
          # 건수(N, buildCommitMessageBody/writeCommitSummary가 이미 계산해 둠)이고
          # 그다음 줄부터가 "- 게시글"/"- 시리즈" 그룹으로 나뉜 본문이다 — 그룹 헤더
          # 줄까지 세어버리는 `wc -l` 대신 이 첫 줄을 그대로 N으로 쓴다. 요약 파일이
          # 없으면(드리프트 반영 없이 sync-state.json 메타데이터만 갱신된 실행이라도
          # 8개 카테고리 중 하나로는 반드시 잡히므로 이 분기는 방어적 기본값이다) 총
          # 건수를 0건으로 표기하고 본문 없이 제목 줄만 커밋한다.
          sync_date=$(TZ='Asia/Seoul' date +%Y-%m-%d)
          if [ -f .sync-commit-summary.txt ]; then
            change_count=$(head -n1 .sync-commit-summary.txt)
            git commit -m "chore: 게시글 동기화 (${sync_date}, 총 ${change_count}건)" -m "$(tail -n +2 .sync-commit-summary.txt)"
            rm -f .sync-commit-summary.txt
          else
            git commit -m "chore: 게시글 동기화 (${sync_date}, 총 0건)"
          fi

          # 병합 검토 없이 기본 브랜치로 즉시 push한다(spec.md Clarifications Session 2026-07-22).
          # 다른 실행과 겹쳐 push가 거부되면 자동 재시도 없이 이 스텝을 실패로 종료한다 —
          # 다음 예약 실행이나 관리자의 수동 재실행으로 자연히 복구된다(Edge Cases 참고).
          if ! git push; then
            echo "push 실패 - 다른 실행과 겹쳤을 수 있습니다. 재시도하지 않고 실패로 종료합니다." >&2
            exit 1
          fi
